apiVersion: v1
kind: Secret
metadata:
  name: aether-secrets
  namespace: aether-trader
type: Opaque
stringData:
  database-url: "postgresql://aether:aether_secret@postgres-svc:5432/aether_trader"
  redis-url: "redis://redis-svc:6379/0"
  exchange-api-key: ""
  exchange-api-secret: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aether-models-pvc
  namespace: aether-trader
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aether-postgres-pvc
  namespace: aether-trader
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard
