version: "3.9"

services:
  # ============================================================
  # Application Services
  # ============================================================

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: aether-backend
    ports:
      - "8000:8000"
    environment:
      - AETHER_DATABASE_URL=postgresql://aether:aether_secret@postgres:5432/aether_trader
      - AETHER_REDIS_URL=redis://redis:6379/0
      - AETHER_DEBUG=false
      - AETHER_LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aether-network
    volumes:
      - model-data:/app/models
      - log-data:/app/logs

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    container_name: aether-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - aether-network

  # ============================================================
  # Data Services
  # ============================================================

  postgres:
    image: postgres:16-alpine
    container_name: aether-postgres
    environment:
      POSTGRES_DB: aether_trader
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: aether_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether -d aether_trader"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aether-network

  redis:
    image: redis:7-alpine
    container_name: aether-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aether-network

  # ============================================================
  # Monitoring Services
  # ============================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: aether-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    restart: unless-stopped
    networks:
      - aether-network

  grafana:
    image: grafana/grafana:latest
    container_name: aether-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=aether_grafana
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - aether-network

  # ============================================================
  # Workflow Orchestration
  # ============================================================

  airflow-webserver:
    image: apache/airflow:2.8.1-python3.11
    container_name: aether-airflow-webserver
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql://aether:aether_secret@postgres:5432/airflow
      - AIRFLOW__CORE__FERNET_KEY=YlCImzjge_1fd6fQRyOaih-JRKLlEEFMDpVKfJn6f8A=
      - AIRFLOW__WEBSERVER__SECRET_KEY=aether_airflow_secret
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
    ports:
      - "8080:8080"
    volumes:
      - ./infrastructure/airflow/dags:/opt/airflow/dags
      - ./infrastructure/airflow/plugins:/opt/airflow/plugins
      - airflow-logs:/opt/airflow/logs
    command: webserver
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aether-network

  airflow-scheduler:
    image: apache/airflow:2.8.1-python3.11
    container_name: aether-airflow-scheduler
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql://aether:aether_secret@postgres:5432/airflow
      - AIRFLOW__CORE__FERNET_KEY=YlCImzjge_1fd6fQRyOaih-JRKLlEEFMDpVKfJn6f8A=
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
    volumes:
      - ./infrastructure/airflow/dags:/opt/airflow/dags
      - ./infrastructure/airflow/plugins:/opt/airflow/plugins
      - airflow-logs:/opt/airflow/logs
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aether-network

# ============================================================
# Volumes & Networks
# ============================================================

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  model-data:
  log-data:
  airflow-logs:

networks:
  aether-network:
    driver: bridge
